<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5fb">
  <title>To-Do Tracker</title>
  <script>
    // Set theme before first paint: saved choice, otherwise the phone/system setting
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    :root {
      --bg: #f4f5fb;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #e5e7ef;
      --accent: #6366f1;
      --accent-2: #8b5cf6;
      --heading: #2e7d32;
      --row-hover: #f8f9ff;
      --danger: #dc2626;
      --warn: #b45309;
      --warn-bg: #fef3c7;
      --shadow: 0 4px 16px rgba(31, 36, 48, 0.06);
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #0f1117;
      --card: #1a1d27;
      --text: #e8eaf2;
      --muted: #9aa0b4;
      --border: #2a2e3d;
      --heading: #4cc26a; /* lighter green so it stays readable on dark */
      --row-hover: #20243a;
      --danger: #f87171;
      --warn: #fbbf24;
      --warn-bg: #3a2c0f;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 32px 16px;
      transition: background 0.2s, color 0.2s;
    }
    .app { max-width: 900px; margin: 0 auto; }
    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr; /* heading in the middle, buttons on the right */
      align-items: center;
      margin-bottom: 20px;
    }
    h1 {
      grid-column: 2;
      margin: 0;
      font-size: 28px;
      text-align: center;
      color: var(--heading);
    }
    .hbtns { grid-column: 3; justify-self: end; display: flex; gap: 10px; }
    .iconbtn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 20px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .alert {
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--warn-bg);
      color: var(--warn);
      font-weight: 600;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .card.editing { outline: 2px solid var(--accent); }
    form { display: flex; flex-wrap: wrap; gap: 10px; }
    input, select {
      flex: 1 1 140px;
      min-width: 0;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 16px; /* 16px stops mobile browsers zooming on focus */
      font-family: inherit;
    }
    /* Compact add form: line 1 = item + Add, line 2 = the other fields (wraps on phones) */
    #formCard { padding: 12px; }
    form { gap: 8px; }
    form input, form select { flex: 1 1 110px; min-height: 38px; padding: 6px 10px; font-size: 14px; }
    #item { order: 1; flex: 1 1 calc(100% - 90px); }
    #submit { order: 1; }
    #priority { order: 2; flex: 0 1 90px; }
    #deadline, #requestedBy, #category, #repeat { order: 2; }
    #notes { order: 2; flex: 2 1 100px; }
    #cancel { order: 3; }
    input:focus, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }
    button { font-family: inherit; }
    #submit {
      min-height: 38px;
      padding: 6px 18px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    #submit:hover { filter: brightness(1.1); }
    .ghost {
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      cursor: pointer;
    }
    .ghost:hover:not(:disabled) { background: var(--row-hover); }
    .ghost:disabled { opacity: 0.45; cursor: default; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .toolbar #search { flex: 1 1 100%; }
    .chips { display: flex; gap: 8px; flex: 1 1 100%; overflow-x: auto; padding-bottom: 2px; }
    .chip {
      min-height: 40px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    .count { margin: 16px 4px 8px; color: var(--muted); font-size: 14px; }

    .card.table-card { padding: 0; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      padding: 14px 16px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--row-hover); }
    tr.done td:not(:last-child) { text-decoration: line-through; opacity: 0.5; }
    tr.over td:first-child { box-shadow: inset 3px 0 0 var(--danger); }
    .title { font-weight: 600; }
    .notes { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .cat {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .tag {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .val.due-over { color: var(--danger); font-weight: 600; }
    .val.due-today, .val.due-soon { color: var(--warn); font-weight: 600; }
    .due-over .tag { background: rgba(220, 38, 38, 0.12); }
    .due-today .tag, .due-soon .tag { background: var(--warn-bg); }
    td.actions-cell { white-space: nowrap; }
    td button {
      border: 0;
      background: transparent;
      font-size: 17px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 8px;
    }
    td button:hover { background: var(--border); }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .p-High { background: #fee2e2; color: #b91c1c; }
    .p-Medium { background: #fef3c7; color: #b45309; }
    .p-Low { background: #d1fae5; color: #047857; }
    :root[data-theme="dark"] .p-High { background: #4c1d1d; color: #fca5a5; }
    :root[data-theme="dark"] .p-Medium { background: #4a3512; color: #fcd34d; }
    :root[data-theme="dark"] .p-Low { background: #12402f; color: #6ee7b7; }

    .empty { padding: 36px 16px; text-align: center; color: var(--muted); font-size: 17px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      width: max-content;
      max-width: calc(100% - 24px);
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--text);
      color: var(--bg);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .toast button {
      min-height: 36px;
      padding: 4px 8px;
      border: 0;
      background: transparent;
      color: #a5b4fc;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    :root[data-theme="dark"] .toast button { color: #4f46e5; }

    /* Phones: each item becomes its own card */
    @media (max-width: 640px) {
      body { padding: 16px 12px calc(88px + env(safe-area-inset-bottom)); }
      h1 { font-size: 22px; }
      .hbtns { gap: 6px; }
      .iconbtn { width: 40px; height: 40px; font-size: 18px; }
      .toolbar input, .toolbar select { flex: 1 1 100%; }
      /* 16px inputs stop the phone zooming on focus; two per row keeps the form short */
      form input, form select { flex: 1 1 calc(50% - 4px); min-height: 42px; font-size: 16px; }
      #item { flex: 1 1 calc(100% - 80px); }
      #submit { flex: 0 0 auto; min-height: 42px; }
      #notes { flex: 1 1 calc(50% - 4px); }
      #priority { flex: 1 1 calc(50% - 4px); }
      #cancel { flex: 1 1 100%; }
      .actions .ghost { flex: 1 1 calc(50% - 5px); }
      .card.table-card {
        background: transparent;
        border: 0;
        box-shadow: none;
        overflow: visible;
      }
      table, tbody, tr, td { display: block; }
      thead { display: none; }
      tbody tr {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 4px 14px;
        margin-bottom: 12px;
        box-shadow: var(--shadow);
      }
      tr.over { border-left: 4px solid var(--danger); }
      tr.over td:first-child { box-shadow: none; }
      td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        text-align: right;
      }
      td::before {
        content: attr(data-label);
        flex-shrink: 0;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        text-align: left;
      }
      td:first-child { display: block; text-align: left; padding: 12px 0 10px; }
      td:first-child::before { content: none; }
      td:first-child .title { font-size: 17px; }
      td:last-child { justify-content: flex-end; gap: 6px; border-bottom: 0; }
      td:last-child::before { content: none; }
      td button { min-width: 48px; min-height: 48px; font-size: 22px; }
      .empty { background: var(--card); border: 1px solid var(--border); border-radius: 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>To-Do Tracker</h1>
      <div class="hbtns">
        <button id="bell" class="iconbtn" type="button" aria-label="Deadline reminders" hidden></button>
        <button id="theme" class="iconbtn" type="button" aria-label="Switch light/dark mode"></button>
      </div>
    </header>

    <div id="alert" class="alert" hidden></div>

    <div class="card" id="formCard">
      <form id="form">
        <input id="item" class="wide" placeholder="What needs to be done?" required>
        <select id="priority" aria-label="Priority">
          <option>High</option>
          <option selected>Medium</option>
          <option>Low</option>
        </select>
        <input id="deadline" type="date" aria-label="Deadline">
        <input id="requestedBy" placeholder="Requested by">
        <input id="category" list="categories" placeholder="Category">
        <datalist id="categories"></datalist>
        <select id="repeat" aria-label="Repeat">
          <option value="">No repeat</option>
          <option value="daily">Repeats daily</option>
          <option value="weekly">Repeats weekly</option>
          <option value="monthly">Repeats monthly</option>
        </select>
        <input id="notes" class="wide" placeholder="Notes (optional)">
        <button id="submit">Add</button>
        <button id="cancel" class="ghost" type="button" hidden>Cancel</button>
      </form>
    </div>

    <div class="toolbar">
      <input id="search" type="search" placeholder="🔍 Search items, notes, people…" aria-label="Search">
      <div class="chips" id="chips">
        <button type="button" class="chip active" data-status="all">All</button>
        <button type="button" class="chip" data-status="open">Open</button>
        <button type="button" class="chip" data-status="done">Done</button>
        <button type="button" class="chip" data-status="high">High priority</button>
      </div>
      <select id="fRequester" data-all="All requesters" aria-label="Filter by requester"></select>
      <select id="fCategory" data-all="All categories" aria-label="Filter by category"></select>
    </div>

    <div class="count" id="count"></div>

    <div class="card table-card">
      <table>
        <thead>
          <tr><th>Item</th><th>Priority</th><th>Deadline</th><th>Requested by</th><th></th></tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
      <div id="empty" class="empty" hidden></div>
    </div>

    <div class="actions">
      <button id="exportJson" class="ghost" type="button">⬇️ Export JSON</button>
      <button id="exportCsv" class="ghost" type="button">⬇️ Export CSV</button>
      <button id="importBtn" class="ghost" type="button">⬆️ Import</button>
      <button id="clearDone" class="ghost" type="button">🧹 Clear completed</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>
  </div>

  <div id="toast" class="toast" hidden>
    <span id="toastMsg"></span>
    <button id="toastUndo" type="button">Undo</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
